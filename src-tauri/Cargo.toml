[package]
name = "fpaste"
version = "0.1.0"
description = "FPaste — next-generation clipboard manager"
authors = ["FPaste contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "fpaste_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
clipboard-rs = "0.2"
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate", "aes-crypto"] }
enigo = "0.3"
