[package]
name = "fpaste"
version = "0.1.8"
description = "FPaste — next-generation clipboard manager"
authors = ["FPaste contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "fpaste_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
clipboard-rs = "0.2"
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
lru = "0.12"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate", "aes-crypto"] }
enigo = "0.3"
tauri-plugin-autostart = "2.5.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# macOS: reativar o app anterior no auto-paste (NSWorkspace / NSRunningApplication)
# e arredondar a camada nativa da janela sem a `macOSPrivateApi` (msg_send em objc2).
# Versões alinhadas às que o próprio `tauri` já usa (objc2 0.6 / app-kit 0.3).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication", "libc"] }
